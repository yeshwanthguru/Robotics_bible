<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="common.css"><title>Q-learning in a grid world</title></head><body>
<h1>Q-learning in a grid world</h1><p class="note">The agent must get from S to the goal G (+10) and avoid the cliff (red, -10). Each step costs -0.1. Arrows show the learned best action; colour shows the state value (green high, red low). Watch the policy form as it explores. Click a cell to toggle a wall.</p>
<canvas id="c"></canvas><div class="ctl" id="k"></div><div class="read" id="r"></div>
<script src="common.js"></script><script>
//TITLE: Q-learning in a grid world
//NOTE: The agent must get from S to the goal G (+10) and avoid the cliff (red, -10). Each step costs -0.1. Arrows show the learned best action; colour shows the state value (green high, red low). Watch the policy form as it explores. Click a cell to toggle a wall.
const cv=setup($('c'),0.6),ctl=$('k');const NX=8,NY=5;let alpha=0.3,gamma=0.95,eps=0.2,wall=new Set(['3,1','3,2','5,3']),Q,ep=0,ret=0,rets=[],pos0=[0,4],ag,spd=40;
const GOAL='7,4',CLIFF=new Set(['2,4','3,4','4,4','5,4','6,4']),A=[[0,-1],[1,0],[0,1],[-1,0]];
slider(ctl,'learning rate α',0.05,1,0.05,alpha,a=>alpha=a);slider(ctl,'discount γ',0.5,0.99,0.01,gamma,a=>gamma=a);slider(ctl,'exploration ε',0,1,0.05,eps,a=>eps=a);slider(ctl,'speed',1,300,1,spd,a=>spd=a,v=>v);btn(ctl,'Reset learning',init,1);
function init(){Q={};ep=0;rets=[];ag=pos0.slice();ret=0}const q=(x,y)=>Q[x+','+y]||(Q[x+','+y]=[0,0,0,0]);
cv.addEventListener('pointerdown',e=>{const p=pos(cv,e),x=Math.floor(p[0]/(cv.W/NX)),y=Math.floor(p[1]/(cv.H/NY)),k=x+','+y;if(k===GOAL||CLIFF.has(k)||(x==0&&y==4))return;wall.has(k)?wall.delete(k):wall.add(k);init()});
function step(){const[x,y]=ag,Qs=q(x,y);let a=Math.random()<eps?Math.floor(Math.random()*4):Qs.indexOf(Math.max(...Qs));
let nx=x+A[a][0],ny=y+A[a][1];if(nx<0||ny<0||nx>=NX||ny>=NY||wall.has(nx+','+ny)){nx=x;ny=y}const k=nx+','+ny;let r=-0.1,done=false;
if(k===GOAL){r=10;done=true}else if(CLIFF.has(k)){r=-10;done=true}
const target=r+(done?0:gamma*Math.max(...q(nx,ny)));Qs[a]+=alpha*(target-Qs[a]);ret+=r;
if(done){rets.push(ret);if(rets.length>50)rets.shift();ep++;ret=0;ag=pos0.slice()}else ag=[nx,ny]}
init();let acc=0;loop(dt=>{acc+=dt*spd;while(acc>=1){step();acc--}const c=cv.ctx,W=cv.W,H=cv.H,w=W/NX,h=H/NY;c.clearRect(0,0,W,H);
for(let x=0;x<NX;x++)for(let y=0;y<NY;y++){const k=x+','+y,v=Math.max(...q(x,y));
if(wall.has(k)){c.fillStyle=css('--fg');c.fillRect(x*w,y*h,w,h);continue}
if(CLIFF.has(k)){c.fillStyle='rgba(225,29,72,.55)'}else if(k===GOAL){c.fillStyle='rgba(22,163,74,.6)'}else{const t=Math.max(-1,Math.min(1,v/8));c.fillStyle=t>0?`rgba(22,163,74,${t*.5})`:`rgba(225,29,72,${-t*.5})`}
c.fillRect(x*w,y*h,w,h);c.strokeStyle=css('--line');c.strokeRect(x*w,y*h,w,h);
if(!CLIFF.has(k)&&k!==GOAL){const Qs=q(x,y),m=Math.max(...Qs);if(m!==0||Qs.some(z=>z!==0)){const a=Qs.indexOf(m),cx=x*w+w/2,cy=y*h+h/2,d=A[a];c.strokeStyle=css('--fg');c.lineWidth=2;c.beginPath();c.moveTo(cx-d[0]*w*.25,cy-d[1]*h*.25);c.lineTo(cx+d[0]*w*.25,cy+d[1]*h*.25);c.stroke();c.beginPath();c.arc(cx+d[0]*w*.25,cy+d[1]*h*.25,3.5,0,7);c.fillStyle=css('--fg');c.fill()}}}
c.fillStyle=css('--fg');c.font='bold 14px sans-serif';c.fillText('S',6,H-8);c.fillText('G',(NX-1)*w+8,H-8);c.fillText('CLIFF',3.2*w,H-8);
c.fillStyle=css('--acc');c.beginPath();c.arc(ag[0]*w+w/2,ag[1]*h+h/2,10,0,7);c.fill();
const avg=rets.length?rets.reduce((a,b)=>a+b,0)/rets.length:0;$('r').innerHTML='episodes <b>'+ep+'</b> &nbsp; average return (last 50) <b>'+avg.toFixed(2)+'</b> &nbsp; With high ε the agent keeps exploring and falls off the cliff more; with ε=0 early it can get stuck.'});

</script></body></html>
